[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mveeg"
version = "0.3.1"
description = "Manifest-backed EEG preprocessing, encoding, and decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["EEG", "encoding", "decoding", "neuroscience", "psychology"]
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "duckdb>=1.5",
    "scikit-learn>=1.7",
    "joblib>=1.4",
    "mne>=1.12",
    "autoreject>=0.4.3",
    "matplotlib>=3.10",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mveeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
